name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装
        run: pip install .
      - name: 语法与入口
        run: |
          python -m compileall -q ipcsurface.py
          ipcsurface --help
      - name: 造示例包（冒烟要用；checkout 里没有 examples/build）
        run: cd examples && bash build.sh
      - name: 三道闸（用例 + 冒烟 + 自查）
        run: bash scripts/verify.sh
      - name: 拿不到证据时要报错，不能静悄悄过
        run: |
          set +e
          echo '{}' > empty.json
          ipcsurface empty.json > /dev/null 2>&1
          code=$?
          echo "exit=$code"
          test "$code" -ne 0

  windows:
    # 这一节验的是「只在 Windows 上才不一样」的路径：
    # 目录 fsync 不可用、符号链接建不出来、replace 被占用、长路径。
    # 这些以前只在作者本机手动跑过，等于没验。
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装
        run: pip install .
      - name: 造示例包
        run: cd examples && bash build.sh
      - name: 三道闸（Windows）
        run: bash scripts/verify.sh
      - name: Windows 专属行为断言
        run: python scripts/check_windows_behaviour.py

  e2e:
    # 端到端：装成包 → 对一个「像真项目」的靶场跑 → 校验 schema、口径、退出码。
    # 以前只有单元与冒烟，缺一条从安装到报告的完整路径。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装成包
        run: pip install .
      - name: 造靶场（含可复现真包 realish）
        run: cd examples && bash build.sh
      - name: 端到端跑一遍并校验
        run: python scripts/e2e_check.py

  signal:
    # 这一节验的是「CI 能不能靠退出码和 SARIF 做判断」，不是验工具本身
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 造靶场
        run: |
          pip install .
          cd examples && bash build.sh
      - name: 干净靶子必须退出 0
        run: |
          set -e
          ipcsurface examples/build/static-asar.asar -o /tmp/clean.md --fail-on high
          echo "干净包退出了 $?"
      - name: 有问题的靶子必须退出 2
        run: |
          set +e
          ipcsurface examples/build/obf-asar.asar -o /tmp/dirty.md --fail-on high
          code=$?
          echo "有问题的包退出了 $code"
          test "$code" -eq 2
      - name: 产出 SARIF 并上传
        if: always()
        run: |
          ipcsurface examples/build/obf-asar.asar --format sarif -o /tmp/ipcsurface.sarif || true
          python -c "import json;d=json.load(open('/tmp/ipcsurface.sarif'));print('sarif', d['version'], len(d['runs'][0]['results']), 'results')"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/ipcsurface.sarif
